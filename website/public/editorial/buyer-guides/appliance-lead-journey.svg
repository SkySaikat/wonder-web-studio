<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>From local search to a repair inquiry</title><desc>Appliance repair lead journey: local search, service page, appliance and ZIP-code check, then dispatch follow-up.</desc><rect width="1200" height="800" rx="32" fill="#f0ede8"/><g font-family="Arial, sans-serif"><text x="72" y="75" font-size="17" letter-spacing="3" fill="#4b2acc">WONDERWEB / A PRACTICAL EXAMPLE</text><text x="72" y="146" font-size="40" font-weight="700" fill="#211d29">From local search to a repair inquiry</text><g><rect x="72" y="220" width="498" height="192" rx="24" fill="#d9ff58"/><text x="100" y="267" font-size="30" font-weight="700" fill="#211d29">Search locally</text><text x="100" y="314" font-size="26" fill="#463d55">Accepted services</text><text x="100" y="350" font-size="26" fill="#463d55">Real coverage</text></g><g><rect x="630" y="220" width="498" height="192" rx="24" fill="#cab5ff"/><text x="658" y="267" font-size="30" font-weight="700" fill="#211d29">Explain the repair</text><text x="658" y="314" font-size="26" fill="#463d55">Appliances &amp; brands</text><text x="658" y="350" font-size="26" fill="#463d55">Clear contact path</text></g><g><rect x="72" y="470" width="498" height="192" rx="24" fill="#b9dafb"/><text x="100" y="517" font-size="30" font-weight="700" fill="#211d29">Check job fit</text><text x="100" y="564" font-size="26" fill="#463d55">Appliance + ZIP code</text><text x="100" y="600" font-size="26" fill="#463d55">Usable contact details</text></g><g><rect x="630" y="470" width="498" height="192" rx="24" fill="#272137"/><text x="658" y="517" font-size="30" font-weight="700" fill="#fff">Arrange next step</text><text x="658" y="564" font-size="26" fill="#e1d8ef">Dispatch follow-up</text><text x="658" y="600" font-size="26" fill="#e1d8ef">Record the outcome</text></g><text x="72" y="754" font-size="18" fill="#5e5268">Clear decisions. Relevant inquiries. A useful next step.</text></g></svg>