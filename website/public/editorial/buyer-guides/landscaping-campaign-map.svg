<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><title>One business. Different buying journeys.</title><desc>Landscaping campaign map separating recurring maintenance, installation projects and commercial grounds contracts into matching inquiry paths.</desc><rect width="1200" height="800" rx="32" fill="#f0ede8"/><g font-family="Arial, sans-serif"><text x="72" y="75" font-size="17" letter-spacing="3" fill="#4b2acc">WONDERWEB / A PRACTICAL EXAMPLE</text><text x="72" y="146" font-size="40" font-weight="700" fill="#211d29">One business. Different buying journeys.</text><g><rect x="72" y="230" width="1056" height="138" rx="24" fill="#d9ff58"/><text x="100" y="277" font-size="30" font-weight="700" fill="#211d29">Maintenance</text><text x="552" y="280" font-size="26" fill="#463d55">Property + coverage</text><text x="552" y="316" font-size="26" fill="#463d55">Recurring service request</text><path d="M 432 296 h65 m-18 -18 l18 18 -18 18" stroke="#4b2acc" stroke-width="4" fill="none"/></g><g><rect x="72" y="400" width="1056" height="138" rx="24" fill="#cab5ff"/><text x="100" y="447" font-size="30" font-weight="700" fill="#211d29">Installations</text><text x="552" y="450" font-size="26" fill="#463d55">Project + timing</text><text x="552" y="486" font-size="26" fill="#463d55">Installation conversation</text><path d="M 432 466 h65 m-18 -18 l18 18 -18 18" stroke="#4b2acc" stroke-width="4" fill="none"/></g><g><rect x="72" y="570" width="1056" height="138" rx="24" fill="#b9dafb"/><text x="100" y="617" font-size="30" font-weight="700" fill="#211d29">Commercial</text><text x="552" y="620" font-size="26" fill="#463d55">Site + scope</text><text x="552" y="656" font-size="26" fill="#463d55">Contract review</text><path d="M 432 636 h65 m-18 -18 l18 18 -18 18" stroke="#4b2acc" stroke-width="4" fill="none"/></g><text x="72" y="754" font-size="18" fill="#5e5268">Clear decisions. Relevant inquiries. A useful next step.</text></g></svg>